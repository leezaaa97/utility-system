<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Field Officer Dashboard</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./assets/css/officer.css">
</head>
<body>

    <div class="dashboard-container">
        
        <aside class="sidebar">
            <div class="logo">
                <h2>DASH</h2>
            </div>

            <nav style="flex: 1; display: flex; flex-direction: column;">
                <div class="nav-section">
                    <ul style="margin-top: 1rem;">
                        <li class="active">
                            <i class="ph ph-gauge" style="font-size: 1.2rem;"></i>
                            <span>Meter Reading</span>
                        </li>
                    </ul>
                </div>

                <div class="nav-footer">
                    <ul>
                        <li class="logout" onclick="logout()">
                            <i class="ph ph-sign-out" style="font-size: 1.2rem;"></i>
                            <span>Log Out</span>
                        </li>
                    </ul>
                </div>
            </nav>
        </aside>

        <main class="main-content">
            <div class="container-fluid p-0" style="max-width: 1000px; margin: 0 auto;">
                
                <h1>Meter Entry</h1>

                <div class="row">
                    <div class="col-md-8 mb-4">
                        <div class="custom-card">
                            <h5>Find Meter</h5>
                            <div class="search-container mb-4">
                                <div class="search-wrapper">
                                    <i class="ph ph-magnifying-glass"></i>
                                    <input type="text" id="meter-search-input" placeholder="Search by Meter ID..." autocomplete="off">
                                </div>
                                <ul class="suggestions-list" id="suggestions-list"></ul>
                            </div>

                            <h5 class="mt-4">Reading Details</h5>
                            <div class="row mb-3">
                                <div class="col-md-6 mb-3 mb-md-0">
                                    <label class="form-label-bold">Start Date</label>
                                    <input type="date" class="dash-input" id="start-date">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label-bold">End Date</label>
                                    <input type="date" class="dash-input" id="end-date">
                                </div>
                            </div>

                            <div class="row mb-4">
                                <div class="col-md-6 mb-3 mb-md-0">
                                    <label class="form-label-bold">Previous Reading</label>
                                    <input type="number" class="dash-input" id="prev-reading-input" disabled placeholder="-">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label-bold">Current Reading</label>
                                    <input type="number" class="dash-input" id="current-reading" placeholder="Enter value">
                                </div>
                            </div>

                            <div class="text-end">
                                <button class="btn-primary-custom" id="submit-btn">Submit Reading</button>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-4 mb-4">
                        <div class="info-panel">
                            <h5 style="margin-bottom: 1.5rem; opacity: 0.8;">Customer Info</h5>
                            
                            <div class="info-row">
                                <span class="info-label">Customer ID</span>
                                <span class="info-val" id="info-cust-id">-</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Meter Status</span>
                                <span class="info-val" id="info-status">-</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Utility Type</span>
                                <span class="info-val" id="info-type">-</span>
                            </div>

                            <div style="margin-top: 2rem; text-align: center; opacity: 0.5;">
                                <i class="ph ph-user-circle" style="font-size: 4rem;"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-4">
                    <p class="mb-2" style="font-size: 0.9rem; color: var(--primary-dark);">
                        Is the meter you're using having an issue? If so report a fault
                    </p>
                    <button id="open-fault-modal" class="btn-primary-custom" style="background-color: #1F3A56;">Report Fault</button>
                </div>

            </div>
        </main>
    </div>

    <div id="fault-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Report Fault</h3>
                <span id="close-modal" class="close-x">&times;</span>
            </div>
            
            <div class="modal-body">
                <textarea id="fault-desc" maxlength="1000" placeholder="Describe the issue here..."></textarea>
                <div class="char-count">0/1000</div>
            </div>

            <div class="modal-footer">
                <button id="submit-fault-btn" class="btn-primary-custom" style="background-color: #1F3A56;">Report Fault</button>
            </div>
        </div>
    </div>

    <script src="./assets/js/officer.js"></script>

</body>
</html>
